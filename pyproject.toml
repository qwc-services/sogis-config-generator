[project]
name = "sogis-config-generator"
version = "v2026.08.21"
description = "SO!MAP Config Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask~=1.1.2",
    "werkzeug~=2.0.3",
    "jinja2~=2.11.3",
    "markupsafe~=2.0.1",
    "itsdangerous~=2.0.1",
    "jsonschema~=3.2.0",
    "psycopg2-binary~=2.9.2",
    "requests~=2.23.0",
    "SQLAlchemy~=1.3.5",
    "qwc-services-core~=1.7.0"
]

[dependency-groups]
dev = [
    "flask-cors>=6.0.5",
    "python-dotenv>=1.2.2",
]
